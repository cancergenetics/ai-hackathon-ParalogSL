[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slparalog"
version = "0.1.0"
description = "Predicting synthetic-lethal paralog pairs from sequence-derived, species-agnostic features"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "pyyaml>=6.0",
    "numba>=0.60",
    "pyarrow>=15",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
plm = ["torch==2.14.1", "transformers==5.21.0", "huggingface_hub==2.3.0"]  # Tier C embeddings (pins from requirements-lock.txt)

[project.scripts]
slparalog = "slparalog.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
xfail_strict = true
markers = [
    "data: needs data/raw or data/labels on disk (not available in a fresh checkout)",
    "slow: long-running test, excluded from milestone checks",
]
